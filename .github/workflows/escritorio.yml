# Morgan para Windows (5.0): compila el instalador en las máquinas Windows de GitHub, que ya
# traen Rust y MSVC (decisión mía: en mi PC no se instala nada pesado).
#
# 1. El agente, congelado con PyInstaller (decisión W2): empaquetado/morgan-agente.spec.
# 2. El programa de Tauri (decisión W1) con el agente dentro: escritorio/.
# 3. El instalador NSIS, como artefacto de la ejecución (y, con una etiqueta v5.*, en la
#    página de versiones).

name: Escritorio

on:
  push:
    branches: [main, "ci/**"]
    paths: ["escritorio/**", "empaquetado/**", "src/agente/**", "src/__init__.py",
            "requirements-agente.txt", ".github/workflows/escritorio.yml"]
  workflow_dispatch:

# Escribir: la prueba de las actualizaciones (5.3) publica una versión de prueba y la borra.
permissions:
  contents: write

jobs:
  instalador:
    name: Instalador de Windows
    # Solo en el espejo público (5.0): en el repositorio privado los minutos son limitados (y
    # Windows cuenta doble); allí el trabajo sale «omitido» y no gasta nada.
    if: github.repository == 'wv-Andy/Morgan'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # 5.1: el estado de la bandeja (Rust sin dependencias), probado y mutado en segundos.
      - name: El estado de la bandeja, con sus mutaciones
        shell: pwsh
        run: escritorio/mutaciones.ps1

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: El agente, congelado
        run: |
          python -m pip install -r requirements-agente.txt pyinstaller==6.22.3
          cd empaquetado
          python -m PyInstaller morgan-agente.spec --noconfirm --distpath ../escritorio/src-tauri/agente --workpath ../build-agente
      - name: Que el congelado arranca
        shell: pwsh
        run: |
          $exe = "escritorio/src-tauri/agente/morgan-agente/morgan-agente.exe"
          $env:MORGAN_AGENTE_DIR = "$env:RUNNER_TEMP/estado"
          & $exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe actualizar
          if ($LASTEXITCODE -ne 2) { throw "el congelado no debe actualizarse solo" }
          exit 0   # el 2 de arriba es lo esperado; sin esto, el paso acabaría con él
      # 5.1: pausar corta el agente en menos de 2 s (el congelado de verdad), y la pausa aguanta.
      - name: La pausa, medida
        shell: pwsh
        run: empaquetado/probar_pausa.ps1 -Agente escritorio/src-tauri/agente/morgan-agente

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: El programa y su instalador
        working-directory: escritorio
        # La clave que firma las actualizaciones (5.3): solo como secreto, nunca en el repositorio.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          npx tauri icon ../web/public/logo-512.png
          npx tauri build

      # Instalar, abrir, cerrar a la bandeja, una sola instancia y desinstalar, en una máquina
      # limpia: en un PC con el programa de verdad, la prueba se llevaría el suyo (5.1).
      - name: El instalador, probado
        shell: powershell
        run: |
          $instalador = Get-ChildItem escritorio/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          powershell -ExecutionPolicy Bypass -File empaquetado/probar_instalador.ps1 -Instalador $instalador.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Actualizar encima de la 5.0.1 con ventana, por «Desinstalar antes de instalar» (lo que
      # sale marcado): el agente emparejado por el programa tiene que seguir emparejado (5.1).
      - name: Actualizar sin desemparejar
        shell: powershell
        run: |
          $instalador = Get-ChildItem escritorio/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          powershell -ExecutionPolicy Bypass -File empaquetado/probar_actualizar.ps1 -Instalador $instalador.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Y cambiando de carpeta al actualizar (sacar el programa de donde no debía estar).
          powershell -ExecutionPolicy Bypass -File empaquetado/probar_actualizar.ps1 -Instalador $instalador.FullName -Mover
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Actualizar por GitHub con firma, y la vuelta atrás automática (5.3).
      - name: Actualizar y volver atrás
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $nsis = "escritorio/src-tauri/target/release/bundle/nsis"
          $instalador = Get-ChildItem "$nsis/*.exe" | Select-Object -First 1
          # Una versión «nueva» de verdad: el mismo programa con el número 9.9.9, firmada. Se
          # aparta en otra carpeta: lo que se publica es solo el instalador de la versión de ahora.
          $nueva = Join-Path $env:RUNNER_TEMP "nueva"
          New-Item -ItemType Directory -Force $nueva | Out-Null
          '{"version": "9.9.9"}' | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "version-9.9.9.json")
          Push-Location escritorio
          npx tauri build --config (Join-Path $env:RUNNER_TEMP "version-9.9.9.json")
          Pop-Location
          Move-Item "$nsis/*9.9.9*" $nueva
          $instaladorNuevo = Get-ChildItem "$nueva/*.exe" | Select-Object -First 1
          powershell -ExecutionPolicy Bypass -File empaquetado/probar_actualizacion.ps1 -Instalador $instalador.FullName `
            -NuevoInstalador $instaladorNuevo.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # La ventana por dentro (5.3): una copia de prueba con la característica `depurar` (abre la
      # depuración de WebView2), compilada después del instalador, que se publica sin ella.
      - name: La ventana por dentro
        # Aunque falle la de las actualizaciones: son independientes, y así se ven las dos.
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          python -m pip install websocket-client==1.8.0
          Push-Location escritorio
          npx tauri build --features depurar --no-bundle
          Pop-Location
          $instalador = Get-ChildItem escritorio/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          powershell -ExecutionPolicy Bypass -File empaquetado/probar_ventana.ps1 -Instalador $instalador.FullName `
            -Depurar (Resolve-Path escritorio/src-tauri/target/release/Morgan.exe).Path
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: Morgan-instalador
          # El instalador y su firma (.sig): lo que se publica en cada versión, con `latest.json`.
          path: |
            escritorio/src-tauri/target/release/bundle/nsis/*.exe
            escritorio/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
